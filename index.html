<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Outpost Commander: Junior Astronaut Mission Trainer</title>
    <meta name="description" content="Run a real lunar or Martian outpost! An offline-capable NASA Space Apps educational simulation for kids, classrooms, iPads, and Chromebooks. By Team The Event Horizons." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Outpost Commander" />

    <!-- Apple iOS & iPad PWA Standalone Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outpost Commander" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Flight Panel type: Barlow (words), Barlow Condensed (labels), IBM Plex Mono (numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Microsoft Tile Configuration -->
    <meta name="msapplication-TileColor" content="#0B1120" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    
    <!-- Canonical & Custom Domain URL -->
    <link rel="canonical" href="https://astronaut.beyondthebasics.me/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astronaut.beyondthebasics.me/" />
    <meta property="og:title" content="Outpost Commander: Junior Astronaut Mission Trainer" />
    <meta property="og:description" content="Run a real lunar or Martian outpost! Grounded in NASA telemetry and space weather data." />
    <meta property="og:image" content="https://astronaut.beyondthebasics.me/icons/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://astronaut.beyondthebasics.me/" />
    <meta name="twitter:title" content="Outpost Commander: Junior Astronaut Mission Trainer" />
    <meta name="twitter:description" content="Run a real lunar or Martian outpost! Grounded in NASA telemetry and space weather data." />
    <meta name="twitter:image" content="https://astronaut.beyondthebasics.me/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
